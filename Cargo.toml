[package]
name = "nix-pqc-cache-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Prototype: hybrid Ed25519+ML-DSA-65 signing/verification for Nix binary caches, plus a local trust-translating reverse proxy"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "nix-pqc-cache-proxy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
base64 = "0.22"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
# Pinned to match mycelix-crypto's own pin (this module was vendored from
# there) -- not a hard requirement, just keeps the two in sync if either
# gets bumped.
ml-dsa = "=0.1.1"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "pqc_bench"
harness = false
